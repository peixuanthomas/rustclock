name: release

# Build and distribute installers for every platform whenever a version
# tag (e.g. v0.1.0) is pushed. Can also be run manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # --- macOS code signing & notarization ---
      # Expose the Apple secrets to the build ONLY when a certificate is actually
      # configured. Passing an empty APPLE_CERTIFICATE makes Tauri attempt (and
      # fail) a `security import` of an empty certificate. When no cert is present
      # we fall back to ad-hoc signing ("-"); users then clear the quarantine
      # attribute after download (see the release notes / README).
      - name: Configure Apple code signing
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Apple certificate found — enabling Developer ID signing + notarization."
            echo "APPLE_CERTIFICATE<<__EOF__" >> "$GITHUB_ENV"
            echo "$APPLE_CERTIFICATE" >> "$GITHUB_ENV"
            echo "__EOF__" >> "$GITHUB_ENV"
            {
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "No Apple certificate configured — using ad-hoc signing (-)."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      - name: Build and release with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Clock ${{ github.ref_name }}"
          releaseBody: |
            Desktop clock built with Tauri. Download the installer for your platform below.

            ### macOS users — "Clock 已损坏，无法打开" / "Clock is damaged"
            The app is distributed without a paid Apple notarization, so Gatekeeper
            blocks it on first launch. The app is **not** actually damaged. After
            dragging Clock into Applications, run this once in Terminal:

            ```bash
            xattr -cr /Applications/Clock.app
            ```

            Then open it normally. (Pick the `aarch64` DMG for Apple Silicon, the
            `x64` DMG for Intel Macs.)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
